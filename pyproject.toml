[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "minecraft-name-finder"
version = "0.1.0"
description = "Rate-limit-aware CLI for finding available and soon-to-be-available Minecraft Java usernames."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "sheepex_" }]
keywords = ["minecraft", "username", "cli", "mojang"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27,<1",
    "rich>=13.7",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
minecraft-finder = "minecraft_finder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minecraft_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
